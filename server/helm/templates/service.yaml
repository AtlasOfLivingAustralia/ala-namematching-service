apiVersion: v1
kind: Service
metadata:
  name: svc-{{ include "ala-namematching.fullname" . }}
  labels:
    {{- include "ala-namematching.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "ala-namematching.selectorLabels" . | nindent 4 }}
