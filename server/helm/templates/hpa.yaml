{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ala-namematching.fullname" . }}
  labels:
    {{- include "ala-namematching.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ala-namematching.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Scale up aggressively. Uses selectPolicy: Max so the LARGEST of the two policies
    # (absolute pod count vs percentage of current replicas) wins each period.
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      selectPolicy: Max
      policies:
        - type: Pods
          value: {{ .Values.autoscaling.behavior.scaleUp.pods }}
          periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }}
        - type: Percent
          value: {{ .Values.autoscaling.behavior.scaleUp.percent }}
          periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }}
    # Scale down slowly — index startup is expensive so avoid oscillation.
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.autoscaling.behavior.scaleDown.pods }}
          periodSeconds: {{ .Values.autoscaling.behavior.scaleDown.periodSeconds }}
{{- end }}
