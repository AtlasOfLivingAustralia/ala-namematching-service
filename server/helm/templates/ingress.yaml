{{- if .Values.ingress.enabled }}
{{- $tagParts := list -}}
{{- range $key, $value := .Values.tags -}}
{{- $tagParts = append $tagParts (printf "%s=%s" $key $value) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-{{ include "ala-namematching.fullname" . }}
  labels:
    {{- include "ala-namematching.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # Health checks target the admin port directly (Dropwizard /healthcheck)
    alb.ingress.kubernetes.io/healthcheck-port: "{{ .Values.adminPort }}"
    alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.ingress.wafArn }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: 200,404,301,302
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
    alb.ingress.kubernetes.io/load-balancer-attributes: >
      idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeoutSeconds }},
      access_logs.s3.enabled=true,
      access_logs.s3.bucket={{ .Values.ingress.accessLogsBucket }},
      access_logs.s3.prefix={{ .Values.ingress.accessLogsPrefix }}
    alb.ingress.kubernetes.io/target-group-attributes: >
      deregistration_delay.timeout_seconds={{ .Values.ingress.deregistrationDelaySeconds }}
    alb.ingress.kubernetes.io/tags: {{ join "," $tagParts | quote }}
    alb.ingress.kubernetes.io/listener-attributes.HTTPS-443: >-
      routing.http.response.access_control_allow_origin.header_value=*,
      routing.http.response.access_control_allow_methods.header_value=GET\,POST\,PUT\,DELETE\,OPTIONS\,HEAD,
      routing.http.response.access_control_allow_headers.header_value=X-Requested-With\,Content-Type\,Accept\,Origin\,Authorization
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.hostname }}
    {{- include "ala-namematching.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: svc-{{ include "ala-namematching.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
