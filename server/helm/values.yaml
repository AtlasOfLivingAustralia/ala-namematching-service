# Default values for ala-namematching.
# Override these in helm-values.yaml generated by the pipeline.

replicaCount: 2  # Stateless service — multiple replicas are safe. Min 2 recommended
                 # due to the long index startup time (one pod down = full unavailability).

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Application port (Dropwizard applicationConnectors)
service:
  port: 80
  targetPort: 9179

# Admin port (Dropwizard adminConnectors) — used for health checks and metrics.
# Not exposed via the Service but must be accessible within the pod for probes.
adminPort: 9180

ingress:
  enabled: true
  className: "alb"
  certificateArn: ""
  hostname: ""
  accessLogsBucket: ""
  accessLogsPrefix: ""
  wafArn: ""
  idleTimeoutSeconds: 60
  deregistrationDelaySeconds: 60

internalIngress:
  enabled: false
  # Internal hostname — resolvable within the VPC only (external-dns creates
  # a Route53 private hosted zone record pointing at the internal ALB).
  hostname: ""
  accessLogsBucket: ""
  accessLogsPrefix: ""
  idleTimeoutSeconds: 60
  deregistrationDelaySeconds: 60

tags:
  branch: ""
  component: "backend"
  environment: ""
  Name: ""
  product: "ala-namematching-service"
  version: ""

resources:
  requests:
    memory: 8192Mi
    cpu: 500m
  limits:
    memory: 8192Mi
    cpu: 2

# Extra environment variables to inject into the container
extraEnv: []

# =============================================================================
# Name index — baked into the Docker image at build time (see server/Dockerfile).
# Update INDEX_URL and INDEX_SHA1 in cicd/backend/config.ini when the index
# is refreshed; the pipeline passes them as Docker build args and the new
# image layer is cached when the values are unchanged.
# =============================================================================
index:
  # Path inside the container where the index lives (set at image build time).
  # Matches the EC2/Ansible convention — do not change without rebuilding the image.
  path: "/data/lucene/namematching-nm"

# =============================================================================
# Startup probe covers Dropwizard init + Lucene index open + species group init.
# Index is already on disk (baked into the image), so startup is ~30s.
# Allow up to 2 minutes as a conservative safety margin.
# Liveness/readiness kick in only after the startupProbe succeeds.
# =============================================================================
startupProbe:
  enabled: true
  httpGet:
    path: /healthcheck
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 12   # 12 * 10s = 2 minutes total startup window

livenessProbe:
  enabled: true
  httpGet:
    path: /ping
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5    # 5 * 30s = 150s — tolerates GC pauses before restarting

readinessProbe:
  enabled: true
  httpGet:
    path: /healthcheck
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 15
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# HPA is enabled — the service is stateless and has no EBS/RWO constraint.
# Scale based on CPU; consider KEDA + request-rate metric for better accuracy.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10   # react to load within 10 s (was 60)
      pods: 3                          # add up to 4 pods per period (was 1)
      percent: 100                     # …or double the current replica count — whichever is greater
      periodSeconds: 60                # evaluation window
    scaleDown:
      stabilizationWindowSeconds: 600  # keep pods warm for 10 min before scaling down
      pods: 1                          # remove only 1 pod at a time
      periodSeconds: 300               # …every 5 min

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Application configuration — rendered into /data/config.yml (Dropwizard).
# groups.json and subgroups.json are embedded in the ConfigMap from
# server/helm/config/
# =============================================================================
config:
  useHints: true
  checkHints: true
  allowLoose: true
  cache:
    # Production EC2 runs at 200000 (see ansible-inventories/namematching/namematching-prod comment).
    # The Ansible role template default of 1000 is intentionally conservative.
    entryCapacity: 200000
  logging:
    level: INFO
    alaLevel: WARN
