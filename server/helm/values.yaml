# Default values for ala-namematching.
# Override these in helm-values.yaml generated by the pipeline.

replicaCount: 2  # Stateless service — multiple replicas are safe. Min 2 recommended
                 # due to the long index startup time (one pod down = full unavailability).

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Application port (Dropwizard applicationConnectors)
service:
  port: 80
  targetPort: 9179

# Admin port (Dropwizard adminConnectors) — used for health checks and metrics.
# Not exposed via the Service but must be accessible within the pod for probes.
adminPort: 9180

ingress:
  enabled: true
  className: "alb"
  certificateArn: ""
  hostname: ""
  accessLogsBucket: ""
  accessLogsPrefix: ""

tags:
  branch: ""
  component: "backend"
  environment: ""
  Name: ""
  product: "ala-namematching-service"
  version: ""

resources:
  requests:
    memory: 8192Mi
    cpu: 500m
  limits:
    memory: 8192Mi
    cpu: 2

# Extra environment variables to inject into the container
extraEnv: []

# =============================================================================
# Name index — downloaded by the init container into an emptyDir volume.
# Update INDEX_URL and INDEX_SHA1 in cicd/backend/config.ini when the index
# is refreshed; the pipeline will propagate them here via helm-values.yaml.
# =============================================================================
index:
  url: "https://archives.ala.org.au/archives/nameindexes/2025v1-5/namematching-2025v1-5.tar.gz"
  sha1: "5953177a7fcd34667fb279db270643996fa93adc"
  # Path inside the container where the extracted index lives.
  # Matches the EC2/Ansible convention (/data/lucene/namematching-nm) and
  # the server/config.yml default — do not change without updating both.
  path: "/data/lucene/namematching-nm"

# =============================================================================
# Startup probe covers the index download + extraction + species group init.
# Allow up to 10 minutes total before declaring failure.
# Liveness/readiness kick in only after the startupProbe succeeds.
# =============================================================================
startupProbe:
  enabled: true
  httpGet:
    path: /healthcheck
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 60   # 60 * 10s = 10 minutes total startup window

livenessProbe:
  enabled: true
  httpGet:
    path: /healthcheck
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /healthcheck
    port: 9180
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 15
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# HPA is enabled — the service is stateless and has no EBS/RWO constraint.
# Scale based on CPU; consider KEDA + request-rate metric for better accuracy.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Application configuration — rendered into /data/config.yml (Dropwizard).
# groups.json and subgroups.json are embedded in the ConfigMap from
# server/helm/config/
# =============================================================================
config:
  useHints: true
  checkHints: true
  allowLoose: true
  cache:
    # Production EC2 runs at 200000 (see ansible-inventories/namematching/namematching-prod comment).
    # The Ansible role template default of 1000 is intentionally conservative.
    entryCapacity: 200000
  logging:
    level: INFO
    alaLevel: WARN
