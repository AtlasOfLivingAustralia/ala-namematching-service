version: 0.2
###
# Sends out deploy notifications to Datadog and Slack.

env:
  shell: bash
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  exported-variables:
    - CODEBUILD_BUILD_NUMBER
  secrets-manager:
    DD_API_KEY: ala-secrets-production:datadog-api-key
    SLACK_OAUTH_TOKEN: ala-secrets-production:slack-oauth-token

phases:

  install:
    commands:
      - echo Running on $(lsb_release -d | cut -f2)
      - echo aws-cli version $(aws --version)

  pre_build:
    commands:
      - export PIPELINE_NAME=$(echo $CODEBUILD_INITIATOR | cut -d'/' -f2)
      - export COMMIT_MSG=$(aws codepipeline list-pipeline-executions --pipeline-name $PIPELINE_NAME --max-items 1 --query 'pipelineExecutionSummaries[0].sourceRevisions[*].revisionSummary' | jq -r '.[] | fromjson | .CommitMessage')
      - echo source branch is $SRC_BRANCH
      - echo Environment is $ENVIRONMENT
      - # get the initiator of this current pipeline execution, was it a git commit or a manual trigger?
      - export TRIGGER_DETAIL=$(aws codepipeline get-pipeline-execution --pipeline-name $PIPELINE_NAME --pipeline-execution-id $EXECUTION_ID --query pipelineExecution.trigger.triggerDetail --output text)
      - # if TRIGGER_DETAIL ends in @csiro.au then it's triggered by a manual button press
      - echo TRIGGER_DETAIL is $TRIGGER_DETAIL
      - if [[ $TRIGGER_DETAIL =~ .*csiro.au$ ]]; then
          AUTHOR=$(echo $TRIGGER_DETAIL | rev | cut -d'/' -f1 | rev);
        fi
      - echo Author is $AUTHOR
      - export DEPLOY_MSG="*$AUTHOR* has released a ${ENVIRONMENT} update to *$PRODUCT_NAME* $PRODUCT_COMPONENT. Now live at https://$WS_SUB_DOMAIN.$HOSTED_ZONE/"
      - echo $DEPLOY_MSG

  build:
    commands:
      - echo Datadog deploy notification
      - cicd/dd_notification.sh
      - echo Slack Deploy notification
      - |
        if [ "$SLACK_DEPLOY_NOTIFICATION" == "true" ] ; then
          cicd/slack_notification.sh
        fi
