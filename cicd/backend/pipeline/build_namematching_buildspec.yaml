version: 0.2
###
# Builds the ALA Namematching Service jar with Maven, builds the Docker image,
# and pushes it to Amazon ECR.

env:
  shell: bash
  variables:
    JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2
  secrets-manager:
    DOCKER_PASSWORD: $ALA_SECRETS_NAME:dockerhub-password
    DOCKERHUB_ORG_ACCESS_TOKEN: $ALA_SECRETS_NAME:dockerhub-org-access-token
  exported-variables:
    - BUILD_TAG

phases:
  install:
    commands:
      - echo Installing dependencies...
      - echo Registering QEMU emulators for cross-platform builds...
      - docker run --rm --privileged tonistiigi/binfmt --install all
      - docker buildx create --use --name multiarch-builder

  build:
    commands:
      - echo Build started on $(date)
      - echo Building the Maven project...
      - mvn package -pl server -am -DskipTests
      - echo Renaming jar to fixed name for Dockerfile COPY...
      - cp server/target/ala-namematching-server-*.jar server/target/ala-namematching-server.jar
      - echo Logging in to DockerHub to avoid pull rate limits...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
      - aws ecr get-login-password | docker login -u AWS --password-stdin "https://$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - echo Tagging the Docker image...
      - BUILD_TAG=$CLEAN_BRANCH-$CODEBUILD_BUILD_NUMBER
      - echo build tag is $BUILD_TAG
      - echo Building and pushing the multi-arch Docker image to ECR...
      - |
          docker buildx build --platform linux/amd64,linux/arm64 \
                               -f server/Dockerfile \
                               --build-arg INDEX_URL=$INDEX_URL \
                               --build-arg INDEX_SHA1=$INDEX_SHA1 \
                               -t $ECR_REPO:$BUILD_TAG \
                               -t $ECR_REPO:$IMAGE_TAG \
                               --push \
                               .
      # Update this $ENVIRONMENT to "production" when merging to master for production release
      - |
          if [ "$ENVIRONMENT" = "development" ]; then
            echo Logging in to Docker Hub with the org access token to push only...
            echo $DOCKERHUB_ORG_ACCESS_TOKEN | docker login -u atlasoflivingaustralia --password-stdin
            echo Copying the built image from ECR to the public Docker Hub repo...
            docker buildx imagetools create -t atlasoflivingaustralia/ala-namematching-service:$INDEX_VERSION $ECR_REPO:$IMAGE_TAG
          fi

  post_build:
    commands:
      - echo Build completed on $(date)
