[DEFAULT]
PRODUCT_COMPONENT = backend
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
HELM_RELEASE_NAME = ala-namematching-${ENVIRONMENT}
EKS_NAMESPACE = apps
ECR_STACK_FILE_PFIX = ecr

AUTO_DEPLOY = true
SLACK_DEPLOY_NOTIFICATION = true
SLACK_ALERT_CHANNEL = testing-deployments

DOCKER_USERNAME = systems@ala.org.au

IMAGE_NAME = ala-namematching-service
IMAGE_TAG = latest

; --- Service subdomain ---
WS_SUB_DOMAIN = namematching-ws

; --- Name index ---
; Production index (2025v1-5). Update both URL and SHA1 together when refreshing.
; Dev/test use a separate test archive path — see environment overrides below.
INDEX_URL = https://archives.ala.org.au/archives/nameindexes/2025v1-5/namematching-2025v1-5.tar.gz
INDEX_SHA1 = 5953177a7fcd34667fb279db270643996fa93adc

; --- Search config ---
USE_HINTS = true
CHECK_HINTS = true
ALLOW_LOOSE = true
; Production EC2 uses 200000 (see ansible-inventories comment).
; The Ansible role default of 1000 is intentionally conservative; raise for EKS.
CACHE_ENTRY_CAPACITY = 200000

; --- Resources ---
; 8g heap matches production EC2 (max_memory=8g / min_memory=8g in Ansible inventory).
; The JVM flags (-Xmx/-Xms) are set in the helm deployment.yaml.
CPU_REQUEST = 500m
MEMORY_REQUEST = 8192Mi
CPU_LIMIT = 2
MEMORY_LIMIT = 8192Mi

[development]
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
HELM_RELEASE_NAME = ala-namematching-${CLEAN_BRANCH}
WS_SUB_DOMAIN = namematching-${CLEAN_BRANCH}-ws
; Dev uses a separate test index with lower memory
INDEX_URL = https://archives.ala.org.au/archives/test/nameindexes/2025-1-4/namematching-2025-1-4.tar.gz
INDEX_SHA1 = 5953177a7fcd34667fb279db270643996fa93adc
MEMORY_REQUEST = 2048Mi
MEMORY_LIMIT = 2048Mi

[testing]
EKS_NAMESPACE = testing
WS_SUB_DOMAIN = namematching-eks-ws
INDEX_URL = https://archives.ala.org.au/archives/test/nameindexes/2025-1-4/namematching-2025-1-4.tar.gz
INDEX_SHA1 = 5953177a7fcd34667fb279db270643996fa93adc
MEMORY_REQUEST = 2048Mi
MEMORY_LIMIT = 2048Mi

[staging]

[production]
AUTO_DEPLOY = false
SLACK_ALERT_CHANNEL = deployments
